<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Thẻ quan trọng giúp tự động fit màn hình điện thoại -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tiệc Lẩu 20/10 - Chốt Đơn & Chuẩn Bị</title>
    <!-- Font chữ hiện đại -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Thư viện Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary: #ff4757;
            --primary-dark: #e84118;
            --secondary: #ffa502;
            --bg-gradient: linear-gradient(135deg, #fff5f5 0%, #ffe3e3 100%);
            --glass: rgba(255, 255, 255, 0.95);
            --text-main: #2f3542;
            --text-sub: #747d8c;
            --shadow: 0 8px 25px rgba(255, 71, 87, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Be Vietnam Pro', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 12px;
        }

        @media (min-width: 768px) {
            body { padding: 20px; }
        }

        /* Màn hình nhập tên */
        #login-modal {
            position: fixed;
            inset: 0;
            background: rgba(47, 53, 66, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .login-box {
            background: white;
            padding: 30px 20px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .login-box h2 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .login-box p {
            color: var(--text-sub);
            margin-bottom: 20px;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #dfe4ea;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-full { width: 100%; }

        /* Header tối ưu di động */
        .header {
            max-width: 1100px;
            margin: 0 auto 15px;
            background: var(--glass);
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 600px) {
            .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 18px 25px;
                border-radius: 20px;
                margin-bottom: 20px;
            }
        }

        .header-title h1 {
            font-size: 20px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @media (min-width: 600px) {
            .header-title h1 { font-size: 24px; }
        }

        .user-info-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        @media (min-width: 600px) {
            .user-info-wrapper { width: auto; justify-content: flex-start; gap: 10px; }
        }

        .user-badge {
            background: #ffeaa7;
            color: #d35400;
            padding: 6px 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Container chia cột linh hoạt */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }

        @media (min-width: 900px) {
            .container {
                grid-template-columns: 1.3fr 1fr;
                gap: 20px;
            }
        }

        .card {
            background: var(--glass);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
        }

        @media (min-width: 600px) {
            .card {
                border-radius: 20px;
                padding: 22px;
            }
        }

        .card-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f1f2f6;
            padding-bottom: 10px;
        }

        @media (min-width: 600px) {
            .card-title { font-size: 18px; margin-bottom: 18px; }
        }

        /* Form thêm món trên mobile xếp dọc gọn gàng */
        .add-custom-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            .add-custom-form {
                grid-template-columns: 2fr 1.2fr 1fr auto;
                gap: 8px;
                margin-bottom: 20px;
            }
        }

        /* Bộ lọc danh mục lướt ngang mượt trên đt */
        .categories {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none; /* Ẩn thanh cuộn trên Firefox */
        }
        .categories::-webkit-scrollbar { display: none; } /* Ẩn thanh cuộn trên Chrome/Safari */

        .cat-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid #dfe4ea;
            background: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            transition: 0.2s;
        }

        .cat-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Danh sách gợi ý món (Grid tự co giãn) */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 500px) {
            .menu-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .menu-item {
            background: white;
            border: 1px solid #f1f2f6;
            border-radius: 14px;
            padding: 12px 10px;
            text-align: center;
            transition: 0.2s;
            cursor: pointer;
        }

        .menu-item:active {
            transform: scale(0.97);
            border-color: var(--primary);
        }

        .menu-emoji {
            font-size: 28px;
            margin-bottom: 6px;
            display: block;
        }

        .menu-name {
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 3px;
            color: var(--text-main);
        }

        .menu-cat {
            font-size: 10px;
            color: var(--text-sub);
            background: #f1f2f6;
            padding: 2px 6px;
            border-radius: 8px;
            display: inline-block;
        }

        /* Danh sách chuẩn bị bên phải */
        .shopping-list {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 2px;
        }

        @media (min-width: 900px) {
            .shopping-list { max-height: 420px; }
        }

        .list-item {
            background: white;
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .list-item.checked {
            opacity: 0.5;
            border-left-color: #2ed573;
            text-decoration: line-through;
        }

        .item-info h4 {
            font-size: 14px;
            margin-bottom: 3px;
        }

        .item-meta {
            font-size: 11px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .author-tag {
            background: #eccc68;
            color: #2f3542;
            padding: 1px 6px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 10px;
        }

        .item-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .qty-badge {
            background: #ff47571a;
            color: var(--primary);
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        .icon-btn {
            background: #f1f2f6;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }
        .icon-btn.del:hover, .icon-btn.del:active { background: #ff4757; color: white; }
        .icon-btn.check:hover, .icon-btn.check:active { background: #2ed573; color: white; }

        /* Mini game góc nhân phẩm */
        .fun-box {
            margin-top: 15px;
            background: linear-gradient(135deg, #2f3542, #1e272e);
            color: white;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
        }

        .fun-box h3 {
            color: #ffa502;
            font-size: 15px;
            margin-bottom: 6px;
        }

        #spin-result {
            margin-top: 10px;
            font-size: 14px;
            font-weight: 700;
            color: #2ed573;
            min-height: 22px;
        }

        .status-bar {
            font-size: 11px;
            color: #2ed573;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 2px;
        }
        .dot {
            width: 7px; height: 7px;
            background: #2ed573;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(46, 213, 115, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 213, 115, 0); }
        }
    </style>
</head>
<body>

    <!-- Modal Nhập Tên -->
    <div id="login-modal" style="display: none;">
        <div class="login-box">
            <div style="font-size: 40px; margin-bottom: 8px;">🍲🌸</div>
            <h2>Tiệc Lẩu 20/10</h2>
            <p>Nhập tên của bạn để cùng hội bạn lên thực đơn nhé!</p>
            <div class="input-group">
                <input type="text" id="username-input" placeholder="Ví dụ: Chi Huy, Minh..." maxlength="25">
            </div>
            <button class="btn btn-full" onclick="joinParty()">
                <i class="fa-solid fa-utensils"></i> Vào Bàn Tiệc Ngay
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-title">
            <h1>🍲 Lịch Ăn Lẩu 20/10</h1>
            <div class="status-bar">
                <span class="dot"></span> <span id="sync-status">Đang kết nối hệ thống...</span>
            </div>
        </div>
        <div class="user-info-wrapper">
            <div class="user-badge">
                <i class="fa-solid fa-user-check"></i> <span id="current-user-display">Chi Huy</span>
            </div>
            <button class="icon-btn" title="Đổi tên" onclick="changeName()" style="width: 34px; height: 34px; background: #fff;"><i class="fa-solid fa-pen"></i></button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <!-- Cột trái: Chọn & Thêm món -->
        <div class="card">
            <div class="card-title">
                <span><i class="fa-solid fa-fire-burner" style="color: var(--primary);"></i> Chọn & Thêm Món Nhúng</span>
            </div>

            <!-- Form tự thêm món mới -->
            <div class="add-custom-form">
                <input type="text" id="custom-name" placeholder="Tên món (VD: Bắp bò...)">
                <select id="custom-cat">
                    <option value="Thịt & Hải sản">🥩 Thịt & Hải sản</option>
                    <option value="Rau & Nấm">🥬 Rau & Nấm</option>
                    <option value="Viên thả lẩu">🍡 Viên thả lẩu</option>
                    <option value="Nước lẩu & Mì">🍜 Nước lẩu & Mì</option>
                    <option value="Đồ uống & Khác">🥤 Đồ uống & Khác</option>
                </select>
                <input type="text" id="custom-qty" placeholder="SL" value="1 phần">
                <button class="btn" onclick="addCustomItem()"><i class="fa-solid fa-plus"></i> Thêm</button>
            </div>

            <!-- Bộ lọc -->
            <div class="categories" id="category-filters">
                <button class="cat-btn active" onclick="filterMenu('All', this)">Tất cả</button>
                <button class="cat-btn" onclick="filterMenu('Thịt & Hải sản', this)">🥩 Thịt</button>
                <button class="cat-btn" onclick="filterMenu('Viên thả lẩu', this)">🍡 Viên lẩu</button>
                <button class="cat-btn" onclick="filterMenu('Rau & Nấm', this)">🥬 Rau nấm</button>
                <button class="cat-btn" onclick="filterMenu('Nước lẩu & Mì', this)">🍜 Nước & Mì</button>
                <button class="cat-btn" onclick="filterMenu('Đồ uống & Khác', this)">🥤 Đồ uống</button>
            </div>

            <!-- Danh sách gợi ý click nhanh -->
            <div class="menu-grid" id="suggested-menu"></div>
        </div>

        <!-- Cột phải: Danh sách chốt đơn & Mini game -->
        <div>
            <div class="card">
                <div class="card-title">
                    <span><i class="fa-solid fa-clipboard-list" style="color: #2ed573;"></i> Danh Sách (<span id="total-items">0</span>)</span>
                    <button class="icon-btn del" title="Xóa tất cả" onclick="clearAllItems()"><i class="fa-solid fa-trash-can"></i></button>
                </div>

                <div class="shopping-list" id="shopping-list">
                    <p style="text-align: center; color: var(--text-sub); padding: 25px 0; font-size: 13px;">Chưa có món nào. Hãy chọn món bên trên nhé!</p>
                </div>
            </div>

            <!-- Mini game -->
            <div class="fun-box">
                <h3>🎲 Góc Nhân Phẩm 20/10</h3>
                <p style="font-size: 12px; color: #ced6e0; margin-bottom: 10px;">Ai sẽ là người rửa bát hoặc đi chợ?</p>
                <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
                    <button class="btn" style="background: #ffa502; color: #2f3542; padding: 8px 14px; font-size: 12px;" onclick="spinWheel('rửa bát 🧽')">
                        Quay Rửa Bát
                    </button>
                    <button class="btn" style="background: #2ed573; color: #2f3542; padding: 8px 14px; font-size: 12px;" onclick="spinWheel('đi chợ 🛒')">
                        Quay Đi Chợ
                    </button>
                </div>
                <div id="spin-result"></div>
            </div>
        </div>
    </div>

    <!-- Script xử lý -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "" // Dán link Firebase Realtime Database của bạn vào đây nếu muốn đồng bộ online
        };

        let useFirebase = false;
        let db;

        if (firebaseConfig.databaseURL && firebaseConfig.databaseURL.startsWith("http")) {
            try {
                const app = initializeApp(firebaseConfig);
                db = getDatabase(app);
                useFirebase = true;
                document.getElementById('sync-status').innerText = "Đã kết nối Online";
            } catch (e) {
                console.error(e);
            }
        } else {
            document.getElementById('sync-status').innerText = "Chế độ Local Storage";
            document.getElementById('sync-status').style.color = "#ffa502";
        }

        const suggestedItems = [
            { name: "Ba chỉ bò Mỹ", cat: "Thịt & Hải sản", emoji: "🥩", qty: "1 kg" },
            { name: "Tôm sú tươi", cat: "Thịt & Hải sản", emoji: "🦐", qty: "0.5 kg" },
            { name: "Mực ống", cat: "Thịt & Hải sản", emoji: "🦑", qty: "0.5 kg" },
            { name: "Sườn sụn heo", cat: "Thịt & Hải sản", emoji: "🍖", qty: "0.5 kg" },
            { name: "Đậu hũ phô mai", cat: "Viên thả lẩu", emoji: "🧀", qty: "1 gói" },
            { name: "Thanh cua", cat: "Viên thả lẩu", emoji: "🦀", qty: "1 gói" },
            { name: "Bò viên gân", cat: "Viên thả lẩu", emoji: "🍡", qty: "1 gói" },
            { name: "Rau muống & Cải thảo", cat: "Rau & Nấm", emoji: "🥬", qty: "2 mớ" },
            { name: "Nấm kim châm", cat: "Rau & Nấm", emoji: "🍄", qty: "3 gói" },
            { name: "Ngô ngọt", cat: "Rau & Nấm", emoji: "🌽", qty: "2 bắp" },
            { name: "Cốt lẩu Thái Tomyum", cat: "Nước lẩu & Mì", emoji: "🍲", qty: "2 gói" },
            { name: "Mì tôm / Miến", cat: "Nước lẩu & Mì", emoji: "🍜", qty: "5 gói" },
            { name: "Coca / Sting", cat: "Đồ uống & Khác", emoji: "🥤", qty: "1 lốc" },
            { name: "Trà đào / Nước ép", cat: "Đồ uống & Khác", emoji: "🍹", qty: "2 chai" }
        ];

        let currentUser = localStorage.getItem('lau_username') || "Chi Huy";
        let currentItems = [];

        window.onload = () => {
            renderSuggestedMenu('All');
            
            if (!localStorage.getItem('lau_username')) {
                currentUser = "Chi Huy";
                localStorage.setItem('lau_username', currentUser);
            }
            
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('current-user-display').innerText = currentUser;
            listenData();
        };

        window.joinParty = () => {
            const input = document.getElementById('username-input').value.trim();
            if (!input) return alert("Vui lòng nhập tên của bạn nhé!");
            currentUser = input;
            localStorage.setItem('lau_username', currentUser);
            document.getElementById('current-user-display').innerText = currentUser;
            document.getElementById('login-modal').style.display = 'none';
            confetti({ particleCount: 60, spread: 70, origin: { y: 0.6 } });
        };

        window.changeName = () => {
            document.getElementById('username-input').value = currentUser;
            document.getElementById('login-modal').style.display = 'flex';
        };

        window.renderSuggestedMenu = (category) => {
            const container = document.getElementById('suggested-menu');
            container.innerHTML = '';
            const filtered = category === 'All' ? suggestedItems : suggestedItems.filter(i => i.cat === category);

            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerHTML = `
                    <span class="menu-emoji">${item.emoji}</span>
                    <div class="menu-name">${item.name}</div>
                    <span class="menu-cat">${item.qty}</span>
                `;
                div.onclick = () => saveItem(item.name, item.cat, item.qty, item.emoji);
                container.appendChild(div);
            });
        };

        window.filterMenu = (cat, btn) => {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderSuggestedMenu(cat);
        };

        window.addCustomItem = () => {
            const name = document.getElementById('custom-name').value.trim();
            const cat = document.getElementById('custom-cat').value;
            const qty = document.getElementById('custom-qty').value.trim() || "1 phần";

            if (!name) return alert("Bạn chưa nhập tên món!");
            saveItem(name, cat, qty, "🍽️");
            document.getElementById('custom-name').value = '';
        };

        function saveItem(name, cat, qty, emoji) {
            if (!currentUser) return changeName();
            const newItem = {
                name,
                cat,
                qty,
                emoji,
                addedBy: currentUser,
                checked: false,
                timestamp: Date.now()
            };

            if (useFirebase) {
                const listRef = ref(db, 'lau2010_items');
                push(listRef, newItem);
            } else {
                newItem.id = Date.now().toString();
                currentItems.push(newItem);
                localStorage.setItem('lau2010_local', JSON.stringify(currentItems));
                renderShoppingList();
            }
        }

        function listenData() {
            if (useFirebase) {
                const listRef = ref(db, 'lau2010_items');
                onValue(listRef, (snapshot) => {
                    const data = snapshot.val();
                    currentItems = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
                    renderShoppingList();
                });
            } else {
                currentItems = JSON.parse(localStorage.getItem('lau2010_local') || "[]");
                renderShoppingList();
            }
        }

        function renderShoppingList() {
            const listEl = document.getElementById('shopping-list');
            document.getElementById('total-items').innerText = currentItems.length;

            if (currentItems.length === 0) {
                listEl.innerHTML = `<p style="text-align: center; color: var(--text-sub); padding: 25px 0; font-size: 13px;">Chưa có món nào. Hãy chọn món bên trên nhé!</p>`;
                return;
            }

            listEl.innerHTML = '';
            currentItems.forEach(item => {
                const div = document.createElement('div');
                div.className = `list-item ${item.checked ? 'checked' : ''}`;
                div.innerHTML = `
                    <div class="item-info">
                        <h4>${item.emoji || '🍲'} ${item.name}</h4>
                        <div class="item-meta">
                            <span class="author-tag"><i class="fa-solid fa-user"></i> ${item.addedBy}</span>
                            <span>• ${item.cat}</span>
                        </div>
                    </div>
                    <div class="item-actions">
                        <span class="qty-badge">${item.qty}</span>
                        <button class="icon-btn check" title="Đánh dấu" onclick="toggleCheck('${item.id}', ${item.checked})">
                            <i class="fa-solid fa-check"></i>
                        </button>
                        <button class="icon-btn del" title="Xóa" onclick="deleteItem('${item.id}')">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        window.toggleCheck = (id, currentStatus) => {
            if (useFirebase) {
                update(ref(db, `lau2010_items/${id}`), { checked: !currentStatus });
            } else {
                const idx = currentItems.findIndex(i => i.id === id);
                if (idx > -1) currentItems[idx].checked = !currentStatus;
                localStorage.setItem('lau2010_local', JSON.stringify(currentItems));
                renderShoppingList();
            }
        };

        window.deleteItem = (id) => {
            if (useFirebase) {
                remove(ref(db, `lau2010_items/${id}`));
            } else {
                currentItems = currentItems.filter(i => i.id !== id);
                localStorage.setItem('lau2010_local', JSON.stringify(currentItems));
                renderShoppingList();
            }
        };

        window.clearAllItems = () => {
            if (!confirm("Bạn có chắc muốn xóa toàn bộ danh sách không?")) return;
            if (useFirebase) {
                remove(ref(db, 'lau2010_items'));
            } else {
                currentItems = [];
                localStorage.setItem('lau2010_local', "[]");
                renderShoppingList();
            }
        };

        window.spinWheel = (task) => {
            const participants = [...new Set(currentItems.map(i => i.addedBy))];
            if (currentUser && !participants.includes(currentUser)) participants.push(currentUser);

            if (participants.length === 0) return alert("Chưa có thành viên nào tham gia!");

            const resultEl = document.getElementById('spin-result');
            let count = 0;
            const interval = setInterval(() => {
                const randomName = participants[Math.floor(Math.random() * participants.length)];
                resultEl.innerText = `Đang quay... ${randomName}`;
                count++;
                if (count > 15) {
                    clearInterval(interval);
                    const winner = participants[Math.floor(Math.random() * participants.length)];
                    resultEl.innerHTML = `🎉 Chúc mừng <u>${winner}</u> trúng suất ${task}!`;
                    confetti({ particleCount: 100, spread: 80, origin: { y: 0.7 } });
                }
            }, 80);
        };
    </script>
</body>
</html>
